<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go-Go Conga Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  /* Animated GO-GO wordmark: each O is a conga head seen from above.
     Strikes follow a syncopated two-drum pattern over a 2.4s loop
     (100 BPM, four beats): the low drum on 1 and 3, the high drum
     answering on 2, the and of 2, 4 and the and of 4. */
  :root {
    --red: #E8252B;
    --skin-1: #F2E3C8;
    --skin-2: #D9C098;
    --rim-1: #E8252B;
    --rim-2: #F2A03D;
    --loop: 2.4s;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1600px;height:600px;background:#0a0a0c;overflow:hidden}
  .wrap{width:1600px;height:600px;display:flex;align-items:center;
    justify-content:center;gap:0}
  .ltr{font-family:'Anton',sans-serif;font-size:300px;line-height:1;
    color:#fff;letter-spacing:-.01em;transform:translateY(-10px)}
  .dash{font-family:'Anton',sans-serif;font-size:300px;line-height:1;
    color:var(--red);transform:translateY(-10px);margin:0 6px}
  /* Sized to Anton's cap height at 300px so the drum sits as an O would. */
  .drum{width:220px;height:220px;position:relative;margin:0 20px;
    transform:translateY(-10px)}

  /* Rim ring: the Foundation's gradient, drawn as a full disc with the
     head laid over it. A masked ring failed to render in Chromium. */
  .rim{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 210deg,var(--rim-1),var(--rim-2),
      var(--rim-1),var(--rim-2),var(--rim-1));
    box-shadow:0 10px 30px rgba(0,0,0,.55)}

  /* Head squash on strike. Percentages are strike times / 2.4s. */
  .head{position:absolute;inset:13px;border-radius:50%;
    background:
      radial-gradient(circle at 36% 30%,#fff8ea 0%,var(--skin-1) 34%,
        var(--skin-2) 78%,#bfa47c 100%);
    box-shadow:inset 0 -8px 22px rgba(120,90,55,.45),
      inset 0 6px 14px rgba(255,255,255,.5);
    transform-origin:center;will-change:transform}
  .lo .head{animation:hitLo var(--loop) linear infinite}
  .hi .head{animation:hitHi var(--loop) linear infinite}

  @keyframes hitLo{
    0%{transform:scale(.93)}   4%{transform:scale(1.015)}  12%{transform:scale(1)}
    50%{transform:scale(.93)}  54%{transform:scale(1.015)} 62%{transform:scale(1)}
    100%{transform:scale(1)}
  }
  @keyframes hitHi{
    0%{transform:scale(1)}
    25%{transform:scale(.94)}    29%{transform:scale(1.012)}  35%{transform:scale(1)}
    37.5%{transform:scale(.95)}  41%{transform:scale(1.01)}   47%{transform:scale(1)}
    75%{transform:scale(.94)}    79%{transform:scale(1.012)}  85%{transform:scale(1)}
    87.5%{transform:scale(.95)}  91%{transform:scale(1.01)}   97%{transform:scale(1)}
  }

  /* Tuning lugs - the detail that reads as conga rather than plain circle. */
  .lugs{position:absolute;inset:0;z-index:4}
  .lug{position:absolute;left:50%;top:50%;width:15px;height:30px;
    background:linear-gradient(180deg,#e9e9ef,#8e8e99);border-radius:3px;
    transform-origin:50% 0;margin-left:-7.5px;
    box-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* Ripple rings radiating from a struck head. */
  .rip{position:absolute;inset:26%;border-radius:50%;
    border:6px solid rgba(255,255,255,.85);opacity:0;z-index:3;
    transform:scale(.3);will-change:transform,opacity}
  @keyframes ripple{
    0%{opacity:.9;transform:scale(.22)}
    18%{opacity:0;transform:scale(1.45)}
    100%{opacity:0;transform:scale(1.45)}
  }
  .rip{animation:ripple var(--loop) ease-out infinite}
  .lo .r1{animation-delay:0s}
  .lo .r2{animation-delay:1.2s}
  .hi .r1{animation-delay:.6s}
  .hi .r2{animation-delay:.9s}
  .hi .r3{animation-delay:1.8s}
  .hi .r4{animation-delay:2.1s}

</style>
</head>
<body>
  <div class="wrap">
    <span class="ltr">G</span>

    <div class="drum lo">
      <div class="rim"></div>
      <div class="head"></div>
      <div class="rip r1"></div><div class="rip r2"></div>
      <div class="lugs" id="lugsA"></div>
    </div>

    <span class="dash">-</span>
    <span class="ltr">G</span>

    <div class="drum hi">
      <div class="rim"></div>
      <div class="head"></div>
      <div class="rip r1"></div><div class="rip r2"></div>
      <div class="rip r3"></div><div class="rip r4"></div>
      <div class="lugs" id="lugsB"></div>
    </div>
  </div>

<script>
  // Six lugs per drum, placed on the rim.
  for (const id of ['lugsA', 'lugsB']) {
    const host = document.getElementById(id);
    for (let i = 0; i < 6; i++) {
      const d = document.createElement('div');
      d.className = 'lug';
      d.style.transform = `rotate(${i * 60}deg) translateY(93px)`;
      host.appendChild(d);
    }
  }
</script>
</body>
</html>
